name: Workbench checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Set up simulation and MCAP
        shell: pwsh
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install -r simulator/requirements.txt -r simulator/mcap-requirements.txt
      - run: npm run test:sim
      - run: npm run test:mcap
      - name: Provision pinned editor and run native integration checks
        shell: pwsh
        run: |
          ./desktop/setup-integrations.ps1 -EditorOnly
          npm run test:native
