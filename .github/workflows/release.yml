name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne $expected) { throw "Expected release tag $expected" }
      - run: npm ci
      - run: npm test
      - name: Build MSI
        shell: pwsh
        run: ./packaging/build.ps1 -OutputDirectory "$env:RUNNER_TEMP/artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: pivot-windows-x64
          path: |
            ${{ runner.temp }}/artifacts/*.msi
            ${{ runner.temp }}/artifacts/*.sha256
          if-no-files-found: error
      - name: Verify installation and upgrade from the latest public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/verify-upgrade.ps1 -Installer (Get-ChildItem "$env:RUNNER_TEMP/artifacts/*.msi").FullName

  draft:
    needs: candidate
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pivot-windows-x64
          path: artifacts
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.msi artifacts/*.sha256 \
            --draft --verify-tag --repo "$GITHUB_REPOSITORY" --title "Pivot $RELEASE_TAG" --generate-notes
