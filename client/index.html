<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141520"><title>Pivot · Robotics IDE</title><link rel="icon" href="/pivot.svg"></head>
<body><div id="workbench" data-mode="split" data-sidebar="explorer">
<header class="titlebar"><div class="brand" id="pivot-brand"><img src="/pivot.svg" alt=""><b>pivot<span aria-hidden="true"></span></b><img id="university-brand" alt="" hidden></div><button id="pomodoro-header" type="button" hidden title="Pomodoro timer"><span id="pomodoro-label"></span><time id="pomodoro-time"></time></button><span class="product">Robotics IDE</span>
<button id="project-name" class="header-link"><i data-icon="folder"></i><span>workspace</span><i data-icon="chevron"></i></button><button id="branch" class="header-link"><i data-icon="branch"></i><span>local</span></button>
<div class="title-drag"></div><button id="palette" class="palette-button"><kbd>Ctrl + Shift + P</kbd><span>Command palette</span></button>
<div id="window-controls" hidden><button data-window="minimize" aria-label="Minimize window"><i data-icon="minus"></i></button><button data-window="maximize" aria-label="Maximize or restore window"><i data-icon="square"></i></button><button data-window="close" aria-label="Close window"><i data-icon="close"></i></button></div></header>
<div class="toolbar"><nav id="modes" aria-label="Workspace modes">
<button data-mode="code"><i data-icon="code"></i>Code<kbd>Ctrl+1</kbd></button><button data-mode="debug"><i data-icon="wave"></i>Debug<kbd>Ctrl+2</kbd></button><button data-mode="simulation"><i data-icon="sim"></i>Simulation<kbd>Ctrl+3</kbd></button><button data-mode="split" data-sidebar="explorer"><i data-icon="split"></i>Split<kbd>Ctrl+4</kbd></button></nav>
<div class="run-tools"><button id="run" title="Run current file" aria-label="Run current file"><i data-icon="play"></i><span>Run</span></button><button id="stop" title="Pause simulation and send Ctrl+C to the selected terminal" aria-label="Stop simulation and terminal"><i data-icon="stop"></i><span>Stop</span></button><span class="engine-label"><i class="dot"></i>MuJoCo</span><button id="settings" title="Workspace settings" aria-label="Workspace settings"><i data-icon="settings"></i></button></div></div>
<main id="workspace">
<nav class="rail" aria-label="Activity"><button id="rail-explorer" title="Explorer" aria-label="Explorer"><i data-icon="folder"></i></button><button id="rail-search" title="Find file" aria-label="Find file"><i data-icon="search"></i></button><button id="rail-git" title="Source control" aria-label="Source control"><i data-icon="branch"></i></button><button id="rail-run" title="Run and build tasks" aria-label="Run and build tasks"><i data-icon="run"></i></button><button id="rail-debug" title="Debug" aria-label="Debug workspace"><i data-icon="wave"></i></button></nav>
<aside id="sidebar" class="shell-panel"><div class="side-title"><strong>Explorer</strong><div><button id="new-file" title="File operations" aria-label="File operations"><i data-icon="more"></i></button><button id="refresh" title="Refresh explorer" aria-label="Refresh explorer"><i data-icon="reset"></i></button></div></div><div id="tree"></div>
<section class="source"><div class="side-title"><strong><i data-icon="branch"></i>Source control</strong><button id="git-menu" title="Git actions" aria-label="Git actions"><i data-icon="more"></i></button></div><div id="changes"></div><form id="commit-form"><input id="commit-message" placeholder="Commit message" aria-label="Commit message"><button id="commit">Commit <kbd>Ctrl+Enter</kbd></button></form><button id="push" type="button">Push</button></section>
<div id="tasks" class="task-tray"></div></aside>
<div id="side-resize" class="grip vertical" role="separator" aria-label="Explorer width"></div>
<div id="panels"><div class="stack" id="left-stack">
<section class="panel" id="code-pane"><div class="panel-head"><i data-icon="code"></i><strong>Editor</strong><span class="head-meta">LazyVim</span><button data-max="code-pane" title="Maximize editor"><i data-icon="maximize"></i></button></div><div id="editor-screen" class="pty-screen"></div><div id="editor-message" class="pane-message"></div></section>
<div id="left-resize" class="grip horizontal" role="separator" aria-label="Terminal height"></div>
<section class="panel" id="term-pane"><div class="panel-head"><i data-icon="terminal"></i><strong>Terminal</strong><div id="shell-tabs" class="shell-tabs"></div><button id="new-shell" title="New terminal" aria-label="New terminal"><i data-icon="plus"></i></button><button id="close-shell" title="Close terminal" aria-label="Close terminal"><i data-icon="close"></i></button><button data-max="term-pane" title="Maximize terminal"><i data-icon="maximize"></i></button></div><div id="shell-hosts"></div></section></div>
<div id="main-resize" class="grip vertical" role="separator" aria-label="Split workspace width"></div>
<div class="stack" id="right-stack"><section class="panel" id="sim-pane"><div class="panel-head"><i data-icon="sim"></i><strong>Simulation</strong><div id="projections" class="toggle"><button data-projection="3d" aria-pressed="true">3D</button><button data-projection="2d">2D</button></div><span class="stretch"></span><button id="select-model" title="Pick model" aria-label="Pick model"><i data-icon="folder"></i><span>Pick model</span></button><button id="sim-reset" title="Reset simulation" aria-label="Reset simulation"><i data-icon="reset"></i></button><button id="center-camera" title="Reset camera" aria-label="Reset camera"><i data-icon="target"></i></button><button id="simulation-download" title="Export simulation media" aria-label="Export simulation media"><i data-icon="down"></i></button><button id="sim-menu" title="Simulation options" aria-label="Simulation options"><i data-icon="more"></i></button><button id="sim-fullscreen" title="Enter fullscreen" aria-label="Enter fullscreen" aria-pressed="false"><i data-icon="maximize"></i><span>Exit fullscreen</span></button></div>
<div class="scene-wrap"><div class="viewport"><canvas id="scene" aria-label="MuJoCo mechanism view"></canvas><div id="clip-actions" hidden><output id="clip-times"></output><button id="cancel-clip" type="button">Cancel</button><button id="confirm-clip" type="button">Export clip</button></div><div id="scene-note"></div><div id="scene-empty" hidden><strong>No model loaded</strong><p>Choose a MuJoCo MJCF (.xml) model.</p><button id="pick-model" class="plain-action">Pick model</button></div></div><aside id="model-inspector"><h3>Model</h3><div id="model-name">—</div><h3>Joints</h3><div id="joints"></div><div id="actuators"></div><h3>Solver</h3><div id="solver"></div></aside></div>
<div class="transport"><button id="rewind" title="Go to start" aria-label="Go to start">⏮</button><button id="back" title="Previous sample" aria-label="Previous sample"><i data-icon="back"></i></button><button id="play" title="Play or pause" aria-label="Play or pause"><i data-icon="play"></i></button><button id="step" title="Next step" aria-label="Next step"><i data-icon="step"></i></button><button id="latest" title="Go to latest" aria-label="Go to latest">⏭</button><select id="speed" aria-label="Simulation speed"><option value=".5">0.5×</option><option selected value="1">1.0×</option><option value="2">2.0×</option></select><span id="time">0.000 s</span><div class="simulation-timeline"><input id="timeline" aria-label="Simulation timeline" type="range" min="0" max="1" value="0"><div id="clip-handles" hidden><input id="clip-start" type="range" min="0" max="1" value="0" aria-label="Clip start"><input id="clip-end" type="range" min="0" max="1" value="1" aria-label="Clip end"></div></div></div></section>
<div id="right-resize" class="grip horizontal" role="separator" aria-label="Telemetry height"></div>
<section class="panel" id="debug-pane"><div class="panel-head debug-head"><button data-debug="traces"><i data-icon="wave"></i>Telemetry</button><button data-debug="variables"><i data-icon="variables"></i>Variables</button><button data-debug="logs"><i data-icon="logs"></i>Logs</button><span class="stretch"></span><button id="channels-button" aria-label="Select channels" title="Select channels"><i data-icon="filter"></i></button><button id="export" title="Export CSV" aria-label="Export CSV"><i data-icon="down"></i></button><button id="export-mcap" title="Export MCAP" aria-label="Export MCAP">MCAP</button><button id="clear-telemetry" title="Clear Telemetry" aria-label="Clear Telemetry">Clear</button><button data-max="debug-pane" title="Maximize debug"><i data-icon="maximize"></i></button></div><div id="debug-content"></div></section></div></div></main>
<footer class="dock"><div id="spotify-dock"><button id="music" title="Spotify player"><i data-icon="spotify"></i><span>Spotify</span><span id="music-caption">Open player</span></button></div><span class="stretch"></span><span id="active-theme" class="footer-theme"></span><div class="footer-status"><i class="dot"></i><span id="state">Initializing</span></div><div class="footer-stat" id="capture-label"></div></footer>
</div><dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dismiss" aria-label="Close dialog"><kbd>Esc</kbd></button></div><div id="dialog-content"></div></dialog><div id="toast" role="status"></div><div id="spotify-frame" hidden></div><script type="module" src="/src/main.ts"></script></body></html>
